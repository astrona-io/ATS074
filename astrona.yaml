# Course manifest for ATS074. Each section lists its README, modules (landing, parts, lab Question reading and lab entry after the part tested, summary), a capstone and a quiz.
training:
  id: ATS074
  title: 'OTCA: The OpenTelemetry API and SDK'
  description: Concept lessons, diagrams, playgrounds, graded labs, capstones and original scenario quizzes
    covering every published objective in this OTCA domain. Labs run on kind (Kubernetes 1.35) with a Python
    OpenTelemetry SDK service and an OpenTelemetry Collector. Technical content remains draft.
  certification:
    name: OpenTelemetry Certified Associate
    code: OTCA
    provider: CNCF / Linux Foundation
    domain: The OpenTelemetry API and SDK
    weight: 46
    competencies:
    - Data Model
    - Composability and Extension
    - Configuration
    - Signals (Tracing, Metric, Log)
    - SDK Pipelines
    - Context Propagation
    - Agents
modules:
