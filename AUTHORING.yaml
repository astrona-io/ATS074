- id: section-040
  title: Signals (Tracing, Metric, Log)
  curriculum_item: Signals (Tracing, Metric, Log)
  capstone: true
  section_quiz: true
  modules:
  - id: module-01
    title: Tracing Requests Through Spans And Context
    objectives:
    - Explain trace and span identity and timing.
    - Distinguish parent-child structure from a complete causal explanation.
    - Describe context propagation across service boundaries.
    - Account for sampling, missing spans and sensitive attributes.
    - Choose metric types according to the measured quantity.
    - Distinguish cumulative counters from current-state gauges.
    - Explain histograms and summaries as distribution evidence.
    - Relate aggregation, collection and cardinality to interpretation.
    - Distinguish numerical series from individual event records.
    - Design structured records with useful identity and timing.
    - Correlate logs with metrics without confusing correlation with cause.
    - Account for retention, sampling and sensitive data.
    outline:
    - Tracing Requests Through Spans And Context
    - Counters, Gauges And Distribution Measurements
    - Logs And Events As Evidence Beside Metrics
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-01/course-01-tracing-requests-through-spans-and-context.md
      adapted_from: ATS047/sections/section-030/module-01/course-01-tracing-requests-through-spans-and-context.md
    - reading: sections/section-040/module-01/course-02-counters-gauges-and-distribution-measurements.md
      adapted_from: ATS047/sections/section-010/module-01/course-01-counters-gauges-and-distribution-measurements.md
    - reading: sections/section-040/module-01/course-03-logs-and-events-as-evidence-beside-metrics.md
