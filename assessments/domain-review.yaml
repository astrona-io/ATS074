kind: question_bank
id: ats074-domain-review
course_id: ATS074
exam_code: OTCA
status: draft
provenance: Original practice material; not official examination questions.
scope:
  type: domain
  id: domain-review
  title: The OpenTelemetry API and SDK
placement:
  position: after
  reading: sections/section-070/module-01/course-02-summary.md
questions:
- id: ats074-domain-review-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain trace and span identity and timing.
  source_readings:
  - sections/section-040/module-01/course-01-tracing-requests-through-spans-and-context.md
  prompt: What does a span represent?
  options:
  - id: a
    text: A timed operation within a trace.
    explanation: It records a unit of work and associated context.
  - id: b
    text: Every request ever served by an application.
    explanation: That describes an aggregate population rather than one span.
  - id: c
    text: A mandatory Prometheus time series.
    explanation: Trace storage is separate from the Prometheus metric model.
  correct_option: a
  explanation: It records a unit of work and associated context.
- id: ats074-domain-review-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe context propagation across service boundaries.
  source_readings:
  - sections/section-040/module-01/course-01-tracing-requests-through-spans-and-context.md
  prompt: What connects spans across an HTTP service boundary?
  options:
  - id: a
    text: Identical Pod names in both services.
    explanation: Names do not establish request parentage.
  - id: b
    text: A shared scrape interval alone.
    explanation: Metric collection timing does not propagate request context.
  - id: c
    text: Propagation of compatible trace context.
    explanation: The receiving service needs the incoming relationship information.
  correct_option: c
  explanation: The receiving service needs the incoming relationship information.
- id: ats074-domain-review-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Account for sampling, missing spans and sensitive attributes.
  source_readings:
  - sections/section-040/module-01/course-01-tracing-requests-through-spans-and-context.md
  prompt: Why should concurrent span durations not simply be summed as request latency?
  options:
  - id: a
    text: Every trace span is instantaneous.
    explanation: Spans have measurable timing.
  - id: b
    text: Their execution intervals can overlap.
    explanation: Elapsed wall-clock time differs from the sum of overlapping work.
  - id: c
    text: Prometheus automatically subtracts all overlaps.
    explanation: Tracing analysis is not automatic metric correction.
  correct_option: b
  explanation: Elapsed wall-clock time differs from the sum of overlapping work.
- id: ats074-domain-review-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Trace an observation through the appropriate SDK pipeline.
  source_readings:
  - sections/section-050/module-01/course-01-signal-providers-processing-readers-and-shutdown.md
  prompt: Which pair belongs to a typical trace export path?
  options:
  - id: a
    text: A span processor and trace exporter.
    explanation: They handle ended spans and delivery.
  - id: b
    text: A catalog location and owner reference.
    explanation: Those are catalog concepts.
  - id: c
    text: A browser theme and CSS selector.
    explanation: Those are presentation concepts.
  correct_option: a
  explanation: They handle ended spans and delivery.
- id: ats074-domain-review-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish trace sampling from metric aggregation.
  source_readings:
  - sections/section-050/module-01/course-01-signal-providers-processing-readers-and-shutdown.md
  prompt: How does metric aggregation differ from trace sampling?
  options:
  - id: a
    text: Both always keep one complete request each minute.
    explanation: There is no such universal rule.
  - id: b
    text: Aggregation grants exporter credentials.
    explanation: It does not control authorization.
  - id: c
    text: Aggregation combines measurements; sampling selects trace evidence.
    explanation: They change evidence in different ways.
  correct_option: c
  explanation: They change evidence in different ways.
- id: ats074-domain-review-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain buffering and lifecycle limits without claiming guaranteed delivery.
  source_readings:
  - sections/section-050/module-01/course-01-signal-providers-processing-readers-and-shutdown.md
  prompt: Why can queued telemetry be lost during abrupt process termination?
  options:
  - id: a
    text: Shutdown automatically reconstructs every unrecorded operation.
    explanation: It cannot recreate absent observations.
  - id: b
    text: Buffered observations may not reach export before the process stops.
    explanation: Lifecycle time and queue durability matter.
  - id: c
    text: Every queue is permanently stored by definition.
    explanation: Many SDK queues are in memory.
  correct_option: b
  explanation: Lifecycle time and queue durability matter.
- id: ats074-domain-review-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain context propagation across process and asynchronous boundaries.
  source_readings:
  - sections/section-060/module-01/course-01-active-context-injection-extraction-and-baggage.md
  prompt: What must a receiver normally do before continuing a remote trace?
  options:
  - id: a
    text: Extract supported context from the request carrier.
    explanation: That supplies the relationship for related work.
  - id: b
    text: Rename the service to the caller's name.
    explanation: Service identity remains its own resource.
  - id: c
    text: Copy every request header into metric labels.
    explanation: That creates unrelated privacy and cardinality risks.
  correct_option: a
  explanation: That supplies the relationship for related work.
- id: ats074-domain-review-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish trace context from baggage and authorization.
  source_readings:
  - sections/section-060/module-01/course-01-active-context-injection-extraction-and-baggage.md
  prompt: What is baggage?
  options:
  - id: a
    text: An administrator credential guaranteed by the trace ID.
    explanation: It is not an authorization mechanism.
  - id: b
    text: A complete copy of every span in a request.
    explanation: It does not carry the complete trace history.
  - id: c
    text: Propagated contextual key-value information.
    explanation: It is distinct from the trace's identifiers.
  correct_option: c
  explanation: It is distinct from the trace's identifiers.
- id: ats074-domain-review-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Identify where missing propagation breaks causal relationships.
  source_readings:
  - sections/section-060/module-01/course-01-active-context-injection-extraction-and-baggage.md
  prompt: A task starts after the request loses its active context. What can result?
  options:
  - id: a
    text: A guaranteed catalog ingestion failure.
    explanation: Catalog processing is unrelated.
  - id: b
    text: A span with a missing or incorrect parent relationship.
    explanation: Context must cross asynchronous boundaries correctly.
  - id: c
    text: Automatic recovery of the exact parent by every exporter.
    explanation: Exporters cannot infer every lost relationship.
  correct_option: b
  explanation: Context must cross asynchronous boundaries correctly.
- id: ats074-domain-review-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish language instrumentation agents from Collector agents.
  source_readings:
  - sections/section-070/module-01/course-01-instrumentation-agents-and-local-collection-roles.md
  prompt: How does a Collector agent differ from an instrumentation agent?
  options:
  - id: a
    text: It collects and forwards telemetry near workloads rather than automatically instrumenting all
      code.
    explanation: The roles occupy different pipeline boundaries.
  - id: b
    text: It always rewrites every application method.
    explanation: Collector placement does not imply code instrumentation.
  - id: c
    text: It is only a browser theme.
    explanation: It is a server-side collection component.
  correct_option: a
  explanation: The roles occupy different pipeline boundaries.
- id: ats074-domain-review-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain local collection benefits and authority requirements.
  source_readings:
  - sections/section-070/module-01/course-01-instrumentation-agents-and-local-collection-roles.md
  prompt: Why can local collection be useful?
  options:
  - id: a
    text: It guarantees every business decision has a span.
    explanation: Instrumentation coverage remains necessary.
  - id: b
    text: It removes all credentials from the system automatically.
    explanation: External export can still require credentials.
  - id: c
    text: It centralizes nearby collection and destination handling.
    explanation: Applications can send to a managed nearby endpoint.
  correct_option: c
  explanation: Applications can send to a managed nearby endpoint.
- id: ats074-domain-review-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: Identify unsupported coverage and shared-host data risks.
  source_readings:
  - sections/section-070/module-01/course-01-instrumentation-agents-and-local-collection-roles.md
  prompt: Why review a host-level agent's permissions?
  options:
  - id: a
    text: Permissions only affect chart colors.
    explanation: They govern real resource access.
  - id: b
    text: It may access logs, files or other sensitive host information.
    explanation: Its collection authority should fit its scope.
  - id: c
    text: Local software cannot access confidential data.
    explanation: Location does not remove access risks.
  correct_option: b
  explanation: Its collection authority should fit its scope.
