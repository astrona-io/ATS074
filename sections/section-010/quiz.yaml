# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats074-010
course_id: ATS074
exam_code: OTCA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "Data Model"
questions:
  - id: ats074-010-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain how OTEL_SERVICE_NAME and OTEL_RESOURCE_ATTRIBUTES combine into the service name"
    source_readings:
      - sections/section-010/module-01/course-01-resources-and-service-identity.md
    prompt: |-
      A service sets `OTEL_SERVICE_NAME=shuttle` and `OTEL_RESOURCE_ATTRIBUTES=service.name=other,service.version=1.0.0`. What `service.name` does the SDK put in the resource?
    options:
      - id: a
        text: "`other`, because the attribute list is read last."
        explanation: "The attribute list does not win over the dedicated service name variable."
      - id: b
        text: "`shuttle`, because `OTEL_SERVICE_NAME` takes priority over `service.name` in `OTEL_RESOURCE_ATTRIBUTES`."
        explanation: "Correct. `OTEL_SERVICE_NAME` replaces any `service.name` from the attribute list, without an error."
      - id: c
        text: "`unknown_service`, because two settings conflict."
        explanation: "A conflict is resolved by priority and does not cause the fallback name."
      - id: d
        text: "Both values, as an array."
        explanation: "An attribute has one value for one key."
    correct_option: b
    explanation: "Correct. `OTEL_SERVICE_NAME` replaces any `service.name` from the attribute list, without an error."

  - id: ats074-010-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Decide whether an attribute belongs on the resource, the scope or an individual item"
    source_readings:
      - sections/section-010/module-01/course-01-resources-and-service-identity.md
    prompt: |-
      A team adds `request.id=ord-4711` to `OTEL_RESOURCE_ATTRIBUTES` of a long-running service. What is the problem?
    options:
      - id: a
        text: "The resource is read once at startup, so the value is the same for all requests and wrongly describes the producer."
        explanation: "Correct. A resource describes the stable producer. A per-request value belongs on a span or a log record of that request."
      - id: b
        text: "Resource attributes cannot contain digits."
        explanation: "Resource attribute values are strings and can contain digits."
      - id: c
        text: "The Collector rejects any resource with more than three attributes."
        explanation: "The Collector has no such limit by default."
      - id: d
        text: "The attribute makes the service export in a different protocol."
        explanation: "The resource does not select the protocol."
    correct_option: a
    explanation: "Correct. A resource describes the stable producer. A per-request value belongs on a span or a log record of that request."

  - id: ats074-010-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what happens when no service name is configured"
    source_readings:
      - sections/section-010/module-01/course-01-resources-and-service-identity.md
    prompt: |-
      A Deployment sets neither `OTEL_SERVICE_NAME` nor a `service.name` attribute. What is the likely effect?
    options:
      - id: a
        text: "The SDK refuses to start."
        explanation: "The SDK starts and exports."
      - id: b
        text: "The data is exported with a `service.name` that starts with `unknown_service`, so a backend groups it under an unknown service."
        explanation: "Correct. The export works, so the problem is only visible in the data."
      - id: c
        text: "The Collector adds the Deployment name as the service name."
        explanation: "The Collector does not add a service name by default."
      - id: d
        text: "Only traces are affected; metrics and logs keep the pod name."
        explanation: "The resource is shared by all signals, so all are affected."
    correct_option: b
    explanation: "Correct. The export works, so the problem is only visible in the data."

  - id: ats074-010-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Identify what an instrumentation scope describes and where it appears in OTLP"
    source_readings:
      - sections/section-010/module-01/course-02-instrumentation-scope-and-signal-envelopes.md
    prompt: |-
      In an OTLP trace export, where does the instrumentation scope sit?
    options:
      - id: a
        text: "Inside each span, as an attribute."
        explanation: "The scope is not a span attribute."
      - id: b
        text: "Between the resource and the spans: ResourceSpans contain ScopeSpans, which contain the spans."
        explanation: "Correct. The nesting is resource, scope, then items, and the same shape applies to metrics and logs."
      - id: c
        text: "Above the resource, so one scope covers several services."
        explanation: "The resource is the outer layer."
      - id: d
        text: "Only in the metrics export; spans have no scope."
        explanation: "Spans, metrics and logs all have scope entries."
    correct_option: b
    explanation: "Correct. The nesting is resource, scope, then items, and the same shape applies to metrics and logs."

  - id: ats074-010-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Place identity data at the correct level of the data model"
    source_readings:
      - sections/section-010/module-01/course-02-instrumentation-scope-and-signal-envelopes.md
    prompt: |-
      Which statement about scope names is correct?
    options:
      - id: a
        text: "Two libraries should use the same scope name so a backend can combine them."
        explanation: "Sharing a name hides which library produced the data."
      - id: b
        text: "The scope name and version identify the code that recorded the data, so a library keeps a stable name and reports its own version."
        explanation: "Correct. The scope works as a filter by recording code and version."
      - id: c
        text: "The scope name must equal the service name."
        explanation: "The scope and the service are different levels."
      - id: d
        text: "The SDK reads the scope name from `OTEL_SERVICE_NAME`."
        explanation: "The scope is passed in code when the tracer or meter is created."
    correct_option: b
    explanation: "Correct. The scope works as a filter by recording code and version."

  - id: ats074-010-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain span, metric stream and log record identity"
    source_readings:
      - sections/section-010/module-01/course-03-identity-of-spans-metric-streams-and-log-records.md
    prompt: |-
      A span has `parent_span_id` equal to the `span_id` of another span in the same trace. What does this mean?
    options:
      - id: a
        text: "The two spans are linked by a link."
        explanation: "A link is a separate field and is not a parent relation."
      - id: b
        text: "The first span is a child of the second span."
        explanation: "Correct. The match of parent span ID and span ID in one trace is the parent-child relation."
      - id: c
        text: "The first span is a root span."
        explanation: "A root span has an empty parent span ID."
      - id: d
        text: "The spans belong to different traces."
        explanation: "Spans of one parent-child pair share the trace ID."
    correct_option: b
    explanation: "Correct. The match of parent span ID and span ID in one trace is the parent-child relation."

  - id: ats074-010-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain span, metric stream and log record identity"
    source_readings:
      - sections/section-010/module-01/course-03-identity-of-spans-metric-streams-and-log-records.md
    prompt: |-
      A log record has an empty trace ID. Which cause is plausible?
    options:
      - id: a
        text: "The program wrote the log outside any span, or in a thread that did not carry the span context."
        explanation: "Correct. The SDK copies the trace and span identifiers from the active span only."
      - id: b
        text: "Log records can never carry a trace ID."
        explanation: "Log records can carry trace and span identifiers."
      - id: c
        text: "The metric temporality was set to delta."
        explanation: "Temporality only applies to metrics."
      - id: d
        text: "The resource has no service version."
        explanation: "The resource does not affect the trace ID of a record."
    correct_option: a
    explanation: "Correct. The SDK copies the trace and span identifiers from the active span only."

  - id: ats074-010-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Reason about attribute cardinality, units and timestamps"
    source_readings:
      - sections/section-010/module-02/course-01-attributes-units-and-timestamps.md
    prompt: |-
      A counter has attributes with 1, 3 and 2 possible values. A developer adds an order identifier with 10,000 values per day. What is the main effect?
    options:
      - id: a
        text: "The series count grows from 6 to up to 60,000, and memory and storage grow with it."
        explanation: "Correct. Each combination of attribute values is one time series. Order identifiers belong on spans and logs."
      - id: b
        text: "The counter becomes a gauge."
        explanation: "The data type does not change."
      - id: c
        text: "The SDK converts the counter to a histogram."
        explanation: "The aggregation does not change."
      - id: d
        text: "Nothing changes, because attributes do not create series."
        explanation: "On metrics, each combination of values is its own series."
    correct_option: a
    explanation: "Correct. Each combination of attribute values is one time series. Order identifiers belong on spans and logs."

  - id: ats074-010-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Reason about attribute cardinality, units and timestamps"
    source_readings:
      - sections/section-010/module-02/course-01-attributes-units-and-timestamps.md
    prompt: |-
      A histogram of request duration is created with unit `ms`, but the program records seconds. What does the SDK do?
    options:
      - id: a
        text: "It converts the values to milliseconds."
        explanation: "The SDK does not convert values."
      - id: b
        text: "It rejects the instrument at start."
        explanation: "The SDK accepts the unit as metadata."
      - id: c
        text: "Nothing. It exports the numbers with the declared unit, so the data is wrong by a factor of 1,000."
        explanation: "Correct. The producer must send numbers that match the declared unit."
      - id: d
        text: "It switches the unit to `s`."
        explanation: "The SDK keeps the declared unit."
    correct_option: c
    explanation: "Correct. The producer must send numbers that match the declared unit."

  - id: ats074-010-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain monotonicity, cumulative and delta temporality"
    source_readings:
      - sections/section-010/module-02/course-02-metric-data-points-and-temporality.md
    prompt: |-
      `OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=delta` is set on a Python service. What temporality do an UpDownCounter and a Counter get?
    options:
      - id: a
        text: "Both delta."
        explanation: "The delta preference keeps UpDownCounters cumulative."
      - id: b
        text: "Both cumulative."
        explanation: "The Counter changes to delta."
      - id: c
        text: "Delta for the Counter and cumulative for the UpDownCounter."
        explanation: "Correct. A delta of a level cannot be added up without the starting level."
      - id: d
        text: "Cumulative for the Counter and delta for the UpDownCounter."
        explanation: "The mapping is the other way around."
    correct_option: c
    explanation: "Correct. A delta of a level cannot be added up without the starting level."

  - id: ats074-010-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain monotonicity, cumulative and delta temporality"
    source_readings:
      - sections/section-010/module-02/course-02-metric-data-points-and-temporality.md
    prompt: |-
      A cumulative monotonic sum exports 5, 10, 15, then 3 with a new start time. How should a consumer read the last point?
    options:
      - id: a
        text: "As a negative change of 12."
        explanation: "A monotonic sum does not decrease."
      - id: b
        text: "As a reset: the producer restarted and began a new count."
        explanation: "Correct. A new start time with a lower value means the accumulation restarted."
      - id: c
        text: "As a gauge reading."
        explanation: "The data type is still a sum."
      - id: d
        text: "As a delta point."
        explanation: "The temporality is still cumulative."
    correct_option: b
    explanation: "Correct. A new start time with a lower value means the accumulation restarted."

  - id: ats074-010-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what an exemplar is and configure the exemplar filter"
    source_readings:
      - sections/section-010/module-02/course-03-exemplars-and-semantic-conventions.md
    prompt: |-
      The exemplar filter is `trace_based`. A measurement is recorded outside any span. What happens?
    options:
      - id: a
        text: "It becomes an exemplar without trace identifiers."
        explanation: "With `trace_based`, a sampled active span is needed."
      - id: b
        text: "It is not a candidate for an exemplar, but it still counts in the metric value."
        explanation: "Correct. The filter affects exemplars only, not the aggregated value."
      - id: c
        text: "The metric value is dropped."
        explanation: "Metric values do not depend on the filter."
      - id: d
        text: "The SDK starts a new span for it."
        explanation: "The SDK does not create spans for measurements."
    correct_option: b
    explanation: "Correct. The filter affects exemplars only, not the aggregated value."
