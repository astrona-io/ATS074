# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Fix Trace Identity, Sampling And Error Recording (LAB). Graded against the
# live cluster: Deployment environment and the Collector log. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-074-lab-040-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - python:3.12-slim
      - otel/opentelemetry-collector-contrib:0.164.0

# Starting state: the Collector and a shuttle application that has no service
# name, a sampler that drops every trace and a failing span that records no
# error. The problems are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the Collector and the shuttle with three tracing problems
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the Collector log shows spans from the fixed shuttle
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: workloads-running
      description: The collector and shuttle Deployments are available with their original images
      type: file
      source: validation/validate-workloads-running.sh
      hint: Fix the settings. Do not delete the Deployments or change their images.
    - name: service-name
      description: Spans arrive with the resource attribute service.name set to shuttle
      type: file
      source: validation/validate-service-name.sh
      hint: Set the standard environment variable OTEL_SERVICE_NAME on the shuttle Deployment. Wait for the new pod to install the SDK and export.
    - name: environment-attribute
      description: Spans arrive with deployment.environment.name lab and keep service.version 1.0.0
      type: file
      source: validation/validate-environment-attribute.sh
      hint: OTEL_RESOURCE_ATTRIBUTES is a comma-separated list of key=value pairs. Keep the existing pair and add one.
    - name: sampler-keeps-traces
      description: The sampler keeps every trace and dock, scan and report spans reach the Collector
      type: file
      source: validation/validate-sampler-keeps-traces.sh
      hint: The sampler is chosen with OTEL_TRACES_SAMPLER and its argument with OTEL_TRACES_SAMPLER_ARG. A ratio of 0 keeps no trace.
    - name: parent-child-recorded
      description: The scan span has a parent span in the Collector log
      type: file
      source: validation/validate-parent-child-recorded.sh
      hint: Once spans arrive, read the Parent ID of scan in the Collector log. It must equal the ID of dock.
    - name: failure-recorded
      description: A failed report span has status Error and an exception event
      type: file
      source: validation/validate-failure-recorded.sh
      hint: Read app.py in the shuttle-app ConfigMap. Two arguments of start_as_current_span switch off what the SDK does by default. Restart the Deployment after the edit.

teardown:
  keepCluster: false
