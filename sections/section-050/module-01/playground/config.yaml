# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Trace Pipeline (PLAYGROUND) - playground environment.
# A clean sandbox: it starts the OpenTelemetry Collector and the shuttle
# service (built with the OpenTelemetry Python SDK) and then stays running
# for free exploration. No task, no grading, no `astrona submit`. Built
# untested. The shuttle pod installs the SDK with pip when it starts, so it
# needs several minutes before it exports telemetry.
apiVersion: astrona.io/v1
metadata:
  name: ats-074-playground-050-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - python:3.12-slim
      - otel/opentelemetry-collector-contrib:0.164.0

bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/collector
      namespace: starfleet

teardown:
  keepCluster: false
