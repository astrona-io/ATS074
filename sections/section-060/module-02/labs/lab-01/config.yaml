# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Fix Propagators And Remove A Secret From Baggage (LAB). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-074-lab-060-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - python:3.12-slim
      - otel/opentelemetry-collector-contrib:0.164.0

# Starting state: collector, probe and shuttle in starfleet. The pods install the
# OpenTelemetry Python SDK at start, so they need up to a few minutes.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the collector, the probe and the shuttle and wait until they run
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the old pods are gone
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: workloads-running
      description: collector, probe and shuttle are still available with their original images
      type: file
      source: validation/validate-workloads-running.sh
      hint: Fix the settings with kubectl set env. Do not delete, scale down or replace the Deployments.
    - name: trace-continued
      description: probe.scan spans have a remote parent from the shuttle
      type: file
      source: validation/validate-trace-continued.sh
      hint: Look at the PROPAGATION lines of the probe. A line with remote=false means the probe did not extract the traceparent header.
    - name: secret-removed
      description: The session-token baggage entry is removed and mission still reaches the probe
      type: file
      source: validation/validate-secret-removed.sh
      hint: Keep mission=survey and remove the session-token entry from SHUTTLE_BAGGAGE on the shuttle Deployment.
    - name: propagation-policy
      description: propagation-policy matches the propagators and baggage keys in use
      type: file
      source: validation/validate-propagation-policy.sh
      hint: Create ConfigMap propagation-policy in starfleet with the keys propagators and baggage-keys. Both values must match what the Deployments use.

teardown:
  keepCluster: false
