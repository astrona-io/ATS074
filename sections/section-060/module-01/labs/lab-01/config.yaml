# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Attach Context To A Worker Thread And Read A traceparent (LAB). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-074-lab-060-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - python:3.12-slim
      - otel/opentelemetry-collector-contrib:0.164.0

# Starting state: collector, probe and shuttle in starfleet. The pods install the
# OpenTelemetry Python SDK at start, so they need up to a few minutes.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the collector, the probe and the shuttle and wait until they run
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the old pods are gone
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: workloads-running
      description: collector, probe and shuttle are still available with their original images
      type: file
      source: validation/validate-workloads-running.sh
      hint: Fix the settings with kubectl set env. Do not delete, scale down or replace the Deployments.
    - name: context-attached
      description: Worker thread spans in the shuttle join the dispatch trace
      type: file
      source: validation/validate-context-attached.sh
      hint: The shuttle reads SHUTTLE_ATTACH_CONTEXT. Set it to true on the shuttle Deployment and wait for the new pod.
    - name: traceparent-evidence
      description: traceparent-evidence matches a real header and the span that sent it
      type: file
      source: validation/validate-traceparent-evidence.sh
      hint: Copy one traceparent value from a probe PROPAGATION line and split it at the dashes. parent-id must match span_id of the shuttle client line with the same trace_id.
    - name: collector-received-spans
      description: The collector logs shuttle.dispatch and probe.scan spans
      type: file
      source: validation/validate-collector-received-spans.sh
      hint: Both services export to the collector. Wait for the pods to run and read the collector logs.

teardown:
  keepCluster: false
