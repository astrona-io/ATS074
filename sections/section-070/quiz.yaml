scope:
  type: section
  id: section-070
  title: Agents
questions:
- id: ats074-070-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish a language instrumentation agent from a Collector
    agent
  source_readings:
  - sections/section-070/module-01/course-01-what-an-instrumentation-agent-does.md
  prompt: A team runs the Collector as a DaemonSet and says that all applications
    are now instrumented. A Java service on a node has no OpenTelemetry code and no
    instrumentation agent. What reaches the backend from that service?
  options:
  - id: a
    text: Spans for every incoming request, because the Collector patches the process
      from the node.
    explanation: The Collector does not attach to application processes.
  - id: b
    text: Nothing from the application code, because the Collector only receives,
      processes and forwards telemetry that something else created.
    explanation: Correct. A Collector agent moves telemetry. A language instrumentation
      agent or SDK code creates it.
  - id: c
    text: Spans for outgoing requests only, because the Collector sees network traffic.
    explanation: The Collector does not inspect network traffic to create spans.
  - id: d
    text: Metrics only, because the Collector reads them from the process.
    explanation: The Collector does not read metrics out of an application process.
  correct_option: b
  explanation: Correct. A Collector agent moves telemetry. A language instrumentation
    agent or SDK code creates it.
- id: ats074-070-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Explain what each Python agent command does
  source_readings:
  - sections/section-070/module-01/course-01-what-an-instrumentation-agent-does.md
  prompt: Which command installs an instrumentation package for each library that
    is already installed in the Python environment?
  options:
  - id: a
    text: "`opentelemetry-instrument python app.py`"
    explanation: This command starts the program with the agent attached. It installs
      nothing.
  - id: b
    text: "`opentelemetry-bootstrap -a install`"
    explanation: Correct. Bootstrap reads the installed packages and installs the
      matching instrumentation package for each, so the libraries must be installed
      first.
  - id: c
    text: "`pip install opentelemetry-distro`"
    explanation: The distro installs the API, the SDK and the two commands, but not
      the per-library packages.
  - id: d
    text: "`opentelemetry-collector --install`"
    explanation: There is no such command.
  correct_option: b
  explanation: Correct. Bootstrap reads the installed packages and installs the matching
    instrumentation package for each, so the libraries must be installed first.
- id: ats074-070-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe the start-up mechanism of the Python agent
  source_readings:
  - sections/section-070/module-01/course-01-what-an-instrumentation-agent-does.md
  prompt: Which statement describes how `opentelemetry-instrument` adds telemetry
    to a Flask application?
  options:
  - id: a
    text: It runs a second process that reads the network traffic of the application.
    explanation: The agent works inside the application process, not as a second process.
  - id: b
    text: It rewrites the source files of the application before the start.
    explanation: The source files stay unchanged.
  - id: c
    text: It starts the program with a `sitecustomize` module that builds the SDK
      and patches supported libraries at runtime.
    explanation: Correct. Instrumentors replace library functions with wrappers at
      runtime (monkey patching) inside the same process.
  - id: d
    text: It asks the Collector to wrap the application in a proxy.
    explanation: The Collector has no part in attaching the agent.
  correct_option: c
  explanation: Correct. Instrumentors replace library functions with wrappers at runtime
    (monkey patching) inside the same process.
- id: ats074-070-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Set the service identity with environment variables
  source_readings:
  - sections/section-070/module-01/course-02-configuring-the-agent-with-environment-variables.md
  prompt: Telemetry from a Python service shows a service name that starts with `unknown_service`.
    Which change fixes this for a zero-code deployment?
  options:
  - id: a
    text: Set `OTEL_SERVICE_NAME` on the container and restart the pod.
    explanation: Correct. The agent reads the variable at start and sets `service.name`.
  - id: b
    text: Add a processor to the Collector that renames the service.
    explanation: A Collector rename hides the cause and has to be repeated for every
      service. The identity belongs to the producer.
  - id: c
    text: Set `OTEL_TRACES_EXPORTER=otlp`.
    explanation: This variable selects the exporter, not the name.
  - id: d
    text: Set `OTEL_PYTHON_EXCLUDED_URLS` to the service name.
    explanation: This variable lists URLs to skip.
  correct_option: a
  explanation: Correct. The agent reads the variable at start and sets `service.name`.
- id: ats074-070-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Use disabled instrumentations and excluded URLs
  source_readings:
  - sections/section-070/module-01/course-02-configuring-the-agent-with-environment-variables.md
  prompt: Readiness probes call `/healthz` every five seconds and create many useless
    server spans. The probe must keep working and other URLs must stay recorded. What
    is the correct setting?
  options:
  - id: a
    text: "`OTEL_PYTHON_DISABLED_INSTRUMENTATIONS=flask`"
    explanation: This disables all Flask server spans, not only the health checks.
  - id: b
    text: "`OTEL_PYTHON_EXCLUDED_URLS=healthz`"
    explanation: Correct. The value is a regular expression list. Requests whose URL
      matches are not recorded.
  - id: c
    text: "`OTEL_TRACES_EXPORTER=none`"
    explanation: This turns off all spans.
  - id: d
    text: Remove the readiness probe.
    explanation: The probe is a Kubernetes need. Remove noise in the agent settings
      instead.
  correct_option: b
  explanation: Correct. The value is a regular expression list. Requests whose URL
    matches are not recorded.
- id: ats074-070-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why agent settings need a restart
  source_readings:
  - sections/section-070/module-01/course-02-configuring-the-agent-with-environment-variables.md
  prompt: An operator changes `OTEL_PYTHON_EXCLUDED_URLS` with `kubectl set env` and
    the pod restarts. A colleague edits the value inside a running container instead.
    Why does only the first method work?
  options:
  - id: a
    text: The agent reads the environment once when the process starts.
    explanation: Correct. Instrumentors are patched and the SDK is built at start.
      Nothing watches the environment afterwards.
  - id: b
    text: Kubernetes blocks environment changes in running containers.
    explanation: Kubernetes does not block this. A running process still does not
      read the change.
  - id: c
    text: The Collector caches the old value.
    explanation: The Collector never sees this variable.
  - id: d
    text: The variable only works in a Deployment.
    explanation: The variable is read from any container environment at start.
  correct_option: a
  explanation: Correct. Instrumentors are patched and the SDK is built at start. Nothing
    watches the environment afterwards.
- id: ats074-070-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Name what automatic instrumentation cannot record
  source_readings:
  - sections/section-070/module-01/course-03-what-the-agent-covers-and-what-it-cannot.md
  prompt: A zero-code Flask service handles `/dock` and picks a berth in the handler.
    The team wants the berth in the trace. What is the right approach?
  options:
  - id: a
    text: Change `OTEL_TRACES_EXPORTER`, because the agent can read local variables
      when exporting.
    explanation: The agent sees library calls, not local variables.
  - id: b
    text: Add a Collector processor that reads the berth from the request.
    explanation: The Collector only sees data that already exists in the telemetry.
  - id: c
    text: Add a manual span or attribute with the OpenTelemetry API in the handler,
      and keep the agent.
    explanation: Correct. The API works with the agent. The code uses the tracer the
      agent registered and adds the business fact.
  - id: d
    text: Disable the Flask instrumentation and rely on logs.
    explanation: Disabling the instrumentation removes the data the agent does record.
  correct_option: c
  explanation: Correct. The API works with the agent. The code uses the tracer the
    agent registered and adds the business fact.
- id: ats074-070-q08
  type: single_choice
  difficulty: advanced
  learning_objective: Diagnose a missing span
  source_readings:
  - sections/section-070/module-01/course-03-what-the-agent-covers-and-what-it-cannot.md
  prompt: Spans for the `requests` library are missing. `pip list` shows no `opentelemetry-instrumentation-requests`.
    The Collector is healthy. What is the most likely cause?
  options:
  - id: a
    text: The batch size of the Collector is too large.
    explanation: A batch setting delays data, it does not remove one library.
  - id: b
    text: The gateway drops client spans.
    explanation: The pip list already shows that the package is missing, so the span
      was never created.
  - id: c
    text: "`opentelemetry-bootstrap -a install` ran before `requests` was installed."
    explanation: Correct. Bootstrap sees only installed packages, so a library installed
      later gets no instrumentation.
  - id: d
    text: The SDK exporter uses gRPC.
    explanation: The protocol does not decide which library is instrumented.
  correct_option: c
  explanation: Correct. Bootstrap sees only installed packages, so a library installed
    later gets no instrumentation.
- id: ats074-070-q09
  type: single_choice
  difficulty: beginner
  learning_objective: Describe the agent and gateway roles
  source_readings:
  - sections/section-070/module-02/course-01-agent-and-gateway-roles.md
  prompt: Which description matches the gateway role of the Collector?
  options:
  - id: a
    text: A Collector in each pod that shares the network namespace with the application.
    explanation: That is the sidecar placement of an agent.
  - id: b
    text: A central Collector service that agents and applications send to, and that
      holds backend credentials and central policy.
    explanation: Correct. A gateway is a Deployment behind a Service that can scale
      with replicas.
  - id: c
    text: A Collector inside the application process that patches libraries.
    explanation: That describes a language instrumentation agent, not a Collector.
  - id: d
    text: A Collector that only runs on the node of the control plane.
    explanation: Role comes from placement and purpose, not from a node type.
  correct_option: b
  explanation: Correct. A gateway is a Deployment behind a Service that can scale
    with replicas.
- id: ats074-070-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare sidecar and DaemonSet placement and node-local reach
  source_readings:
  - sections/section-070/module-02/course-01-agent-and-gateway-roles.md
  prompt: Many small pods per node send similar telemetry. Memory use must stay low
    and applications must reach the agent on their own node. Which design fits?
  options:
  - id: a
    text: A sidecar Collector in every pod.
    explanation: One Collector per pod multiplies memory use.
  - id: b
    text: 'A DaemonSet agent with a Service that has `internalTrafficPolicy: Local`.'
    explanation: Correct. One agent per node is shared by the pods, and the Local
      policy keeps traffic on the same node.
  - id: c
    text: One gateway Deployment and no agent.
    explanation: This has no local hop and gives the SDKs the longer network path.
  - id: d
    text: A Collector inside the kind node container only.
    explanation: The node container is not a deployment target for applications.
  correct_option: b
  explanation: Correct. One agent per node is shared by the pods, and the Local policy
    keeps traffic on the same node.
- id: ats074-070-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Order and configure agent processors
  source_readings:
  - sections/section-070/module-02/course-02-processors-in-the-agent.md
  prompt: Which `processors` list is correct for an agent pipeline?
  options:
  - id: a
    text: "`[batch, resourcedetection, memory_limiter]`"
    explanation: "`memory_limiter` last means data was already processed and queued
      before the check."
  - id: b
    text: "`[resourcedetection, batch, memory_limiter]`"
    explanation: "`memory_limiter` should be first so a refusal reaches the receiver
      before more work is done."
  - id: c
    text: "`[memory_limiter, resourcedetection, batch]`"
    explanation: Correct. The limiter first, then the attributes, then the grouping.
  - id: d
    text: "`[batch, memory_limiter]` with `resourcedetection` only defined"
    explanation: A processor that is defined but not listed does nothing.
  correct_option: c
  explanation: Correct. The limiter first, then the attributes, then the grouping.
- id: ats074-070-q12
  type: single_choice
  difficulty: advanced
  learning_objective: Identify the authority and data risks of a node-level agent
  source_readings:
  - sections/section-070/module-02/course-03-authority-and-shared-host-data-risks.md
  prompt: An agent only uses the `otlp` receiver, but its DaemonSet mounts `/var/log`
    from the node with `hostPath`. What is the best response?
  options:
  - id: a
    text: Keep the mount, because it helps the batch processor.
    explanation: Batching does not use host log files.
  - id: b
    text: Remove the volume and its mount, because no receiver needs host files and
      the mount exposes the logs of every pod on the node.
    explanation: Correct. Authority must match the receivers. The `otlp` receiver
      needs no host path.
  - id: c
    text: 'Keep it and add `tls: insecure: true`.'
    explanation: Insecure TLS removes protection and does not address the mount.
  - id: d
    text: 'Replace it with `hostNetwork: true`.'
    explanation: This adds more reach, not less.
  correct_option: b
  explanation: Correct. Authority must match the receivers. The `otlp` receiver needs
    no host path.
