kind: question_bank
id: ats074-section-030
course_id: ATS074
exam_code: OTCA
status: draft
provenance: Original practice material; not official examination questions.
scope:
  type: section
  id: section-030
  title: 'Checkpoint: Resources, Instrumentation Scope And Signal Envelopes, API Independence, SDK Components
    And Extension Contracts, SDK Initialization, Resource Settings And Export Configuration'
placement:
  position: after
  reading: sections/section-030/module-01/course-02-summary.md
questions:
- id: ats074-section-030-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish resource, instrumentation scope and observation attributes.
  source_readings:
  - sections/section-010/module-01/course-01-resources-instrumentation-scope-and-signal-envelopes.md
  prompt: What does instrumentation scope identify?
  options:
  - id: a
    text: The instrumentation source or library producing observations.
    explanation: It differs from the service resource identity.
  - id: b
    text: The user's authorization role for all services.
    explanation: Scope is not an access grant.
  - id: c
    text: The Collector's total disk capacity.
    explanation: That is unrelated runtime state.
  correct_option: a
  explanation: It differs from the service resource identity.
- id: ats074-section-030-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Explain span, metric point and log record identity.
  source_readings:
  - sections/section-010/module-01/course-01-resources-instrumentation-scope-and-signal-envelopes.md
  prompt: Which property is particularly important when interpreting aggregated metric points?
  options:
  - id: a
    text: Only the browser page title.
    explanation: Presentation does not define aggregation.
  - id: b
    text: Only the latest source repository comment.
    explanation: A comment is not metric temporal metadata.
  - id: c
    text: Their temporality and measurement unit.
    explanation: These shape what a value means over time.
  correct_option: c
  explanation: These shape what a value means over time.
- id: ats074-section-030-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Reason about units, timestamps and aggregation metadata.
  source_readings:
  - sections/section-010/module-01/course-01-resources-instrumentation-scope-and-signal-envelopes.md
  prompt: Why should event time and collection time be distinguished?
  options:
  - id: a
    text: Transport automatically removes every delay.
    explanation: Delivery can be buffered or retried.
  - id: b
    text: A delayed record can be observed after the event occurred.
    explanation: The timestamps describe different points in the evidence path.
  - id: c
    text: Every timestamp always means process startup.
    explanation: Timestamp meaning depends on its field.
  correct_option: b
  explanation: The timestamps describe different points in the evidence path.
- id: ats074-section-030-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Explain why reusable instrumentation depends on APIs rather than exporters.
  source_readings:
  - sections/section-020/module-01/course-01-api-independence-sdk-components-and-extension-contracts.md
  prompt: Why should a reusable library avoid fixing the application's exporter?
  options:
  - id: a
    text: The application owns destination and recording policy.
    explanation: API independence supports composition.
  - id: b
    text: Exporters cannot send telemetry.
    explanation: Delivery is their purpose.
  - id: c
    text: Every library must create a separate production backend.
    explanation: That would fragment application control.
  correct_option: a
  explanation: API independence supports composition.
- id: ats074-section-030-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish SDK providers, processors and exporters.
  source_readings:
  - sections/section-020/module-01/course-01-api-independence-sdk-components-and-extension-contracts.md
  prompt: Which component primarily delivers data to a destination?
  options:
  - id: a
    text: A span's display name.
    explanation: A name is observation metadata.
  - id: b
    text: An entity owner annotation.
    explanation: Catalog metadata is unrelated.
  - id: c
    text: An exporter.
    explanation: Its contract concerns delivery.
  correct_option: c
  explanation: Its contract concerns delivery.
- id: ats074-section-030-q06
  type: single_choice
  difficulty: beginner
  learning_objective: Reason about component compatibility and custom extension responsibility.
  source_readings:
  - sections/section-020/module-01/course-01-api-independence-sdk-components-and-extension-contracts.md
  prompt: What responsibility remains when implementing a custom processor?
  options:
  - id: a
    text: Guaranteeing all external systems are always available.
    explanation: No processor can establish that guarantee.
  - id: b
    text: Supported lifecycle, performance and error handling.
    explanation: An extension participates in a running pipeline.
  - id: c
    text: Only choosing a decorative title.
    explanation: Its runtime behavior matters.
  correct_option: b
  explanation: An extension participates in a running pipeline.
- id: ats074-section-030-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Identify configuration owned by the application SDK.
  source_readings:
  - sections/section-030/module-01/course-01-sdk-initialization-resource-settings-and-export-configuration.md
  prompt: Why configure the SDK before relevant application work?
  options:
  - id: a
    text: Early work otherwise may use an unconfigured recording implementation.
    explanation: Initialization timing affects coverage.
  - id: b
    text: Configuration automatically replays every past operation.
    explanation: Past missing observations are not recreated automatically.
  - id: c
    text: The Collector cannot receive any later telemetry.
    explanation: It can receive configured future observations.
  correct_option: a
  explanation: Initialization timing affects coverage.
- id: ats074-section-030-q08
  type: single_choice
  difficulty: beginner
  learning_objective: Explain initialization timing and language-specific environment support.
  source_readings:
  - sections/section-030/module-01/course-01-sdk-initialization-resource-settings-and-export-configuration.md
  prompt: Why check environment-variable support for the selected language?
  options:
  - id: a
    text: Every language ignores all environment variables.
    explanation: Many support useful standard settings.
  - id: b
    text: Every environment variable is encrypted automatically.
    explanation: Variables are not automatically secret storage.
  - id: c
    text: Support and precedence can vary by SDK and distribution.
    explanation: A variable name alone is not universal implementation evidence.
  correct_option: c
  explanation: A variable name alone is not universal implementation evidence.
- id: ats074-section-030-q09
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish endpoint, protocol and sampling configuration failures.
  source_readings:
  - sections/section-030/module-01/course-01-sdk-initialization-resource-settings-and-export-configuration.md
  prompt: An exporter uses HTTP but the destination expects gRPC at another endpoint. What needs correction?
  options:
  - id: a
    text: Only the span's business description.
    explanation: Description does not repair delivery.
  - id: b
    text: The protocol and endpoint contract.
    explanation: Reachability alone does not establish protocol compatibility.
  - id: c
    text: Only the service display name.
    explanation: Identity naming does not change transport.
  correct_option: b
  explanation: Reachability alone does not establish protocol compatibility.
